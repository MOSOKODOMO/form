<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Drawing of a kitchen cabinet front with three green doors">
  <!-- A simple drawing for trying products on when you have no room photo. Drawn for FABINT. -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#efeadf"/><stop offset="1" stop-color="#e3ddcf"/></linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7d9776"/><stop offset="1" stop-color="#667f61"/></linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#wall)"/>
  <rect y="150" width="1600" height="26" fill="#cfc6b3"/>
  <rect y="176" width="1600" height="10" fill="#b9af9a" opacity=".55"/>
  <g>
    <rect x="80" y="214" width="450" height="640" rx="6" fill="url(#door)"/>
    <rect x="112" y="246" width="386" height="576" rx="4" fill="none" stroke="#a9bea3" stroke-width="3" opacity=".8"/>
    <rect x="575" y="214" width="450" height="640" rx="6" fill="url(#door)"/>
    <rect x="607" y="246" width="386" height="576" rx="4" fill="none" stroke="#a9bea3" stroke-width="3" opacity=".8"/>
    <rect x="1070" y="214" width="450" height="640" rx="6" fill="url(#door)"/>
    <rect x="1102" y="246" width="386" height="576" rx="4" fill="none" stroke="#a9bea3" stroke-width="3" opacity=".8"/>
  </g>
  <rect y="880" width="1600" height="120" fill="#d4cbb8"/>
  <rect y="854" width="1600" height="26" fill="#2f3a30"/>
  <text x="800" y="960" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#6a6f66">Sample wall (a drawing, not a photo)</text>
</svg>
