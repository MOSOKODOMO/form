[functions.fi-commerce]
verify_jwt = true

[functions.fi-stripe-webhook]
# Authenticated by Stripe's raw-body signature, never by a browser session.
verify_jwt = false

[functions.fi-enquiry]
# Public enquiry intake validates its website API key, origin and bounded payload.
# A service-only database RPC applies a daily rate limit; no public table inserts.
verify_jwt = false

[functions.fi-log]
# Public service-log intake validates its origin, key, event allowlist and 1 KB size limit.
# It forwards only fixed events to Axiom and never the caller's IP address or browser.
verify_jwt = false

[functions.fi-price-compare]
# Public price lookup for the browser extension. It takes only a product name (3 to 120 characters),
# applies per-address and daily limits, and keeps the SearchApi key in the function environment.
verify_jwt = false
